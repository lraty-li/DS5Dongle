name: BL616 CI

on:
  push:
    paths:
      - ".github/workflows/bl616.yml"
      - ".gitmodules"
      - "ports/bl616/**"
      - "third_party/bouffalo_sdk"
      - "third_party/toolchain_gcc_t-head_windows"
      - "tools/host/**"
  pull_request:
    paths:
      - ".github/workflows/bl616.yml"
      - ".gitmodules"
      - "ports/bl616/**"
      - "third_party/bouffalo_sdk"
      - "third_party/toolchain_gcc_t-head_windows"
      - "tools/host/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bl616-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contract tests and firmware build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run BL616 protocol contract tests
        shell: pwsh
        run: .\tools\host\python3.cmd -m unittest discover -s .\ports\bl616\tests -p "test_*.py" -v

      - name: Build BL616 firmware
        shell: pwsh
        run: .\tools\host\build_bl616.ps1 -Clean

      - name: Verify firmware artifacts
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "ports\bl616\build\build_out"
          $requiredArtifacts = @(
              "ds5dongle_bl616_bl616.bin",
              "boot2_bl616_isp_release_v8.1.8.bin",
              "partition.bin"
          )

          foreach ($artifact in $requiredArtifacts) {
              $path = Join-Path $outputDir $artifact
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required BL616 artifact not found: $path"
              }

              $file = Get-Item -LiteralPath $path
              $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
              Write-Host "$($file.Name): $($file.Length) bytes, SHA256 $hash"
          }

      - name: Upload BL616 firmware
        uses: actions/upload-artifact@v7
        with:
          name: ds5dongle-bl616-${{ github.sha }}
          path: |
            ports/bl616/flash_prog_cfg.ini
            ports/bl616/build/build_out/ds5dongle_bl616_bl616.bin
            ports/bl616/build/build_out/boot2_bl616_isp_release_v8.1.8.bin
            ports/bl616/build/build_out/partition.bin
          if-no-files-found: error
          retention-days: 14
